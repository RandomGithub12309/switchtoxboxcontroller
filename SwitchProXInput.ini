; ============================================================
;  SwitchProXInput configuration
;  Edit values, then restart SwitchProXInput.exe.
;  All options are optional - deleting this file restores defaults.
; ============================================================

[General]
; How many virtual Xbox 360 pads to create (1-4).
MaxControllers=4

; Recognized USB devices, as VID:PID hex pairs separated by ';'.
; The official Nintendo Switch Pro Controller is 057E:2009.
; Third-party pads in "Switch mode" can be added, e.g. 057E:200E.
Devices=057E:2009

[Mapping]
; Face button layout:
;   0 = Xbox physical positions (Xbox A prompt = the Pro Controller's B,
;       because it sits in the same spot). Matches on-screen prompts in
;       most games. This is the default.
;   1 = Same labels (Switch A = Xbox A, B = B, X = X, Y = Y).
ButtonLayout=0

; Capture button: 0 = unmapped, 1 = Back, 2 = Start, 3 = Guide
CaptureButton=0

; Home button: 0 = unmapped, 1 = Guide (also opens the Xbox Game Bar)
HomeButton=1

; Swap bumpers with triggers: L<->ZL and R<->ZR (0/1)
SwapShoulders=0

; Stick deadzone, in percent of the deflection range (0-90).
LeftDeadzone=10
RightDeadzone=10

; Raw stick deflection (out of 2048) that maps to the full XInput range.
; The Pro Controller physically reaches roughly 1400-1700 raw units.
; Lower = more sensitive, higher = less sensitive.
LeftStickRange=1700
RightStickRange=1700

; Invert stick axes (1 = inverted). The official Pro Controller over USB
; reports Y the standard way (raw value rises when the stick is pushed up),
; so 0 is correct for it. If up/down read swapped on your pad (some
; Bluetooth-mode clones and Joy-Con-style pads report Y inverted),
; set the Y flags to 1.
InvertLX=0
InvertLY=0
InvertRX=0
InvertRY=0

[Features]
; Pass the game's rumble to the controller's HD rumble motors (0/1).
EnableRumble=1

[DriftFix]
; Automatic stick-drift correction. The app watches each stick while you
; don't touch it, learns its true resting position and noise floor, and
; re-centers the output / raises the deadzone accordingly. The kind of
; drift detected (center offset / jitter / both) is shown in the window.
;   Enable       1 = apply the learned corrections (recommended)
;   AutoDeadzone 1 = never let the effective deadzone drop below the
;                     measured noise floor of the stick
;   Strength     0 = gentle, 1 = balanced, 2 = aggressive
;                (higher = faster re-learning and larger safety margins,
;                 for badly worn sticks)
Enable=1
AutoDeadzone=1
Strength=1

[System]
; Start the app automatically when you log in to Windows.
; The app starts minimized in the system tray. (0/1)
Autostart=0
; Hide the window to the tray when you click minimize. (0/1)
MinimizeToTray=1
; Hide the window to the tray when you click the X instead of quitting. (0/1)
CloseToTray=0
